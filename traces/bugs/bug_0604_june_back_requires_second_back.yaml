symptom: >
  With June's cattle-first agreement active and no strategy chosen, TALK June at
  the Byre-Yard, then choose BACK. The action says it returns to Cade's reviews,
  but opens a cattle-terms confirmation whose only topic is another BACK.
  Players must choose BACK twice and then TALK Cade to review their plans.

root_cause: >
  keep_cattle_terms used goto: june_cattle_terms_confirmed. The destination
  adds no commitment or consequence and exists only to repeat the exit action.

fix: >
  Make keep_cattle_terms end the conversation directly. Its prompt names the
  Byre-Yard and tells the player to TALK Cade for LURE, DRIVE, or FORTIFY.
  Preserve the topic id, hidden aliases, and every dialogue-node ordinal,
  including the old confirmation node and its usable exit.

invariants:
  - "BACK changes only the engine step and June's dialogue cursor; no plan, ally, journal, inventory, or combat acknowledgement changes."
  - "North stays blocked, Cade is available, and opening his conversation offers all three non-HUNT plans."
  - "BACK remains a free journey dialogue closure. Talking to Cade remains a free dialogue opening."
  - "Legacy dialogue cursor 3 can still close with return_to_cade; source-hash mismatch rejection remains enforced."
  - "MCP full and compact observations, browser engine state, and matching-source save/load agree after BACK and TALK Cade."

