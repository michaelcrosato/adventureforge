name: Deep audit

# Expensive, zero-token checks run outside the PR critical path. Operators can also
# dispatch the exact same jobs when reviewing a risky engine or content change.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deep deterministic quest and overworld crawl
        run: npm run crawl:deep

  # The exhaustive whole-state-space census proofs, moved off the PR critical path.
  # Each one BFSes the complete reachable region of every shipped pack; together they were
  # ~79 minutes of measured body time in ci.yml's shard matrix, and vitest.config.ts
  # deliberately serializes them one or two workers wide, so most of that is a
  # single-threaded tail. They import only the scopes listed in CENSUS_PROOF_SOURCE_SCOPES
  # (scripts/test-lanes.ts is the source of truth; a copy of the list here drifted) —
  # nothing else a PR can touch changes their verdict — which is exactly what makes nightly
  # the right cadence for them and NOT for the rest of the suite.
  #
  # This is the `test:exhaustive` lane in full. `non-player-audit` below separately runs
  # the ending-render proof under its rolling soft budget; the few duplicated minutes buy
  # a lane that is provably the complement of `test:fast` (tests/unit/test_lanes.test.ts),
  # which is worth more here than trimming one overlap.
  exhaustive-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exhaustive census proofs (the nightly complement of the fast lane)
        run: npm run test:exhaustive

  non-player-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install UI dependencies used by root SSR tests
        run: npm --prefix ui ci
      - name: Restore rolling performance baselines
        uses: actions/cache@v4
        with:
          path: ai-runs/performance-budget-history.json
          key: deep-audit-performance-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            deep-audit-performance-${{ github.ref_name }}-
      - name: Trace, density, ending-proof, and standard-coverage audit
        run: npm run audit:non-player
      - name: Upload browsable coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: standard-suite-coverage-${{ github.run_id }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30
