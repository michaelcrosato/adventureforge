name: CI

# Trust, but verify (see AGENTS.md): the agent has free rein over game code, but
# these checks are the BAR — they block a red push/PR. Verification is the agent's
# own instrument for knowing a change is correct, not a human gate.

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege CI token: this workflow only READS the repo (checkout, install,
# build, test, validate) and never writes — so drop the default broad GITHUB_TOKEN
# scope to read-only (supply-chain hardening; no behavioural change to the checks).
permissions:
  contents: read

# Don't pile up redundant runs: a newer commit on the same ref cancels the older,
# still-running CI for that ref (the AFK loop can push frequently).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-prerequisites:
    runs-on: ubuntu-latest
    # Every job gets a ceiling. The critical path is dominated by two unbounded
    # things — the vitest shards and the crawl — and a hung one would otherwise sit
    # against the runner's 6-hour default while the branch looks "in progress".
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is load-bearing, not hygiene. The verifier's real teeth —
      # the per-cycle count ratchet and the guard-weakening check — live in drift
      # mode, which needs the base commit's tree. A shallow clone has no history,
      # so drift mode now fails loudly rather than reporting OK with both checks
      # silently skipped.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verifier integrity (don't route around the verifier)
        run: npm run verify:integrity
      - name: Bug-trace integrity (parse, identity, and path references)
        run: npm run verify:bug-traces
      - name: Opening density budget (before the first player action)
        run: npm run verify:opening-density
      # Static mode alone cannot see a deletion that stays above the floors. Drift
      # mode compares this branch against the base it will merge into, which is the
      # same comparison loop.sh makes per cycle.
      - name: Verifier drift vs the merge base (the count ratchet + guard-weakening check)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run verify:integrity -- --against "$BASE_SHA"
      # A push to main has no PR base, but it does have the previous tip. Running
      # the same ratchet against it closes the one gap the 2026-08-30 audit flagged:
      # an admin direct push (enforce_admins is off) used to receive static mode
      # only, so the actor able to skip review was also exempt from the strongest
      # check. This runs post-hoc — it cannot block the push — but it turns a
      # weakening landed that way into a red run on main instead of silence.
      # github.event.before is the all-zeros SHA on a branch's first push, and can
      # be absent from history after a force push; both fall back loudly to static.
      - name: Verifier drift vs the previous tip (push events)
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "::warning::No usable previous tip ($BEFORE_SHA); the static verifier run above stands on its own."
          else
            npm run verify:integrity -- --against "$BEFORE_SHA"
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      # The web UI is a separate package under ui/ that bundles the headless
      # engine (ui/src imports ../src, which pulls root deps like zod/yaml —
      # installed by `npm ci` above). The vite build resolves every import and
      # fails on real breakage; the tsc step catches the type-level drift the
      # build can't (esbuild strips types without checking — exactly how six
      # real App.tsx type errors against a changed engine API shipped green
      # before this gate existed).
      - name: Install UI deps
        run: npm --prefix ui ci
      # The granular steps above are exactly `npm run health` minus pack
      # validation and tests, so running health here would double-execute the
      # entire pipeline (~2x CI time, doubled flake surface, zero added signal).
      - name: Validate every shipped quest
        run: npm run validate
      - name: Typecheck UI
        run: npm run ui:typecheck
      - name: Build UI (catch UI rot)
        run: npm run ui:build

  # The FAST lane only. The exhaustive whole-state-space census proofs moved to
  # deep-audit.yml: they were ~79 of the ~103 minutes of measured body time in this
  # matrix, and they read only src/core, src/rpg, src/validate, src/world and content/,
  # so nothing else a PR can touch is able to move their verdict. The trade is stated
  # plainly: a content or engine regression that ONLY a census proof catches can now sit
  # on main until the nightly deep audit goes red, instead of blocking the PR.
  test-shards:
    name: Tests (fast lane ${{ matrix.group }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          # Bug-trace tests validate retired paths against reachable history. A
          # depth-1 checkout makes valid historical evidence look like corruption.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Root tests SSR-load UI modules through the real Vite config, so its
      # package-local React/Vite dependencies must exist in every test shard.
      - name: Install UI deps
        run: npm --prefix ui ci
      # Prove the shipped world once here so the ~115 test files that load it reuse the
      # verdict (src/world/source.ts, bug_0611) instead of each re-proving it in their
      # own isolated process. validate always re-proves; the marker it leaves under
      # ai-runs/ is what the shard's processes then read.
      - name: Warm the world-integrity verdict
        run: npm run validate
      - name: Tests (fast lane — unit + property + determinism)
        # Discover every current test file, keep this lane's, then place those in exactly
        # one of two deterministic groups. The allocator weights observed costly files and
        # gives future files a nonzero baseline, avoiding Vitest's opaque raw file-count
        # split without freezing a hand-maintained list. --lane filters BEFORE allocating:
        # letting vitest skip the other lane's files afterwards would leave their measured
        # weight in whichever shard drew it and wreck the balance.
        run: |
          mapfile -t test_files < <(npm exec -- tsx scripts/ci-test-groups.ts --count 2 --group ${{ matrix.group }} --lane fast)
          test "${#test_files[@]}" -gt 0
          npm exec -- vitest run --reporter=verbose "${test_files[@]}"

  # Branch protection requires this exact check name. It runs even when a prerequisite
  # fails, then fails explicitly instead of being skipped or succeeding accidentally.
  verify:
    if: ${{ always() }}
    timeout-minutes: 10
    needs: [verify-prerequisites, test-shards, crawl-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification prerequisites
        env:
          PRECHECK_RESULT: ${{ needs.verify-prerequisites.result }}
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
          CRAWL_SMOKE_RESULT: ${{ needs.crawl-smoke.result }}
        run: |
          test "$PRECHECK_RESULT" = success
          test "$TEST_SHARDS_RESULT" = success
          test "$CRAWL_SMOKE_RESULT" = success

  crawl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Mechanical crawl gate (all quests + overworld, deterministic seeds)
        run: npm run crawl:smoke

  # Every other job here is ubuntu-only, and that blind spot shipped a real defect:
  # four CLIs derived the repo root as `resolve(new URL("..", import.meta.url).pathname)`,
  # which on win32 yields "C:\C:\dev\zork-unlimited". Five tests failed on Windows,
  # `npm run health` was red there, and loop.sh — which gates every cycle on health —
  # could not land a change on that platform, while CI stayed green the whole time.
  #
  # This lane is deliberately NOT the whole suite: a second 34-minute shard pair would
  # double the critical path to catch a narrow class of bug. It runs the static gates
  # (which are where path handling actually breaks) plus the path-sensitive CLI tests,
  # in about three minutes. It is advisory — not in `verify`'s needs list — so a
  # Windows-only runner hiccup cannot block a merge; it exists to make the platform
  # visible at all, which it previously was not.
  windows-smoke:
    name: Windows path + CLI smoke (advisory)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (catches new-URL-pathname via no-restricted-syntax)
        run: npm run lint
      - name: Validate every shipped quest
        run: npm run validate
      - name: Path-sensitive CLI tests
        run: npx vitest run tests/unit/doctor_cli.test.ts tests/unit/record_playtest_session_cli.test.ts tests/unit/qa_triage_cli.test.ts tests/unit/seal_feedback_acceptance.test.ts
